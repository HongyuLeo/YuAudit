name: Windows x64 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - name: Test, package and launch EXE
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YuAudit-Windows-x64
          path: dist/YuAudit-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            build/smoke-exe-zh
            build/smoke-exe-en
            build/smoke-extracted-zip
